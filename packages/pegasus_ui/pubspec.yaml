name: pegasus_ui
description: Thème et composants visuels partagés entre l'app mobile et l'agent PC Pegasus.
version: 0.2.0
publish_to: none

environment:
  sdk: ^3.11.4
  flutter: ">=3.27.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.4
  # Utilisé par lib/testing.dart (outils de test partagés, jamais importé par les apps).
  flutter_test:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/logo/
  fonts:
    - family: Barlow
      fonts:
        - asset: fonts/Barlow-Regular.ttf
          weight: 400
        - asset: fonts/Barlow-Medium.ttf
          weight: 500
        - asset: fonts/Barlow-SemiBold.ttf
          weight: 600
    - family: BarlowCondensed
      fonts:
        - asset: fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: fonts/BarlowCondensed-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: fonts/JetBrainsMono-Variable.ttf
