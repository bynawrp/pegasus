name: pegasus_agent
description: Agent Pegasus pour PC (Windows), contrôlé depuis l'app mobile.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

resolution: workspace

dependencies:
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  path_provider: ^2.1.6
  pegasus_link:
    path: ../packages/pegasus_link
  pegasus_protocol:
    path: ../packages/pegasus_protocol
  pegasus_ui:
    path: ../packages/pegasus_ui
  qr_flutter: ^4.1.0
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
