name: pegasus
description: App mobile Pegasus pour contrôler son PC.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

resolution: workspace

dependencies:
  app_links: ^7.0.0
  characters: ^1.4.1
  connectivity_plus: ^7.3.2
  device_info_plus: ^13.3.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^11.2.0
  mobile_scanner: ^7.5.0
  pegasus_link:
    path: ../packages/pegasus_link
  pegasus_protocol:
    path: ../packages/pegasus_protocol
  pegasus_ui:
    path: ../packages/pegasus_ui
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
